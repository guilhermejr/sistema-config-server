services:
  config-server:
    image: guilhermejr/sistema-config-server
    container_name: config-server
    restart: always
    env_file: /home/guilhermejr/secrets/config-server.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:8888:8888"

networks:
  default:
    external: true
    name: rede